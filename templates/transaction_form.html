{% extends "base.html" %}{% block title %}{{ 'Edit' if transaction else 'Add' }} Transaction · Expense Tracker{% endblock %}{% block content %}<div class="form-card"><h1>{{ 'Edit' if transaction else 'Add' }} transaction</h1><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Amount</label><input class="form-control" type="number" name="amount" min="0.01" step="0.01" value="{{ transaction.amount if transaction else '' }}" required></div><div class="col-md-6"><label class="form-label">Type</label><select class="form-select" name="type" required>{% for value in transaction_types %}<option value="{{ value }}" {% if transaction and transaction.type == value %}selected{% endif %}>{{ value.title() }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Category</label><select class="form-select" name="category" required>{% for value in categories %}<option {% if transaction and transaction.category == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Date</label><input class="form-control" type="date" name="date" value="{{ transaction.date.isoformat() if transaction else today }}" required></div><div class="col-12"><label class="form-label">Description</label><input class="form-control" name="description" maxlength="255" value="{{ transaction.description if transaction else '' }}"></div></div><div class="mt-4"><button class="btn btn-primary">Save transaction</button><a class="btn btn-outline-secondary ms-2" href="{{ url_for('transactions') }}">Cancel</a></div></form></div>{% endblock %}
