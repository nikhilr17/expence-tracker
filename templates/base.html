<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4"><div class="container"><a class="navbar-brand" href="{{ url_for('dashboard') }}">Expense Tracker</a>{% if current_user.is_authenticated %}<span class="text-white">{{ current_user.name }} · <a class="text-white" href="{{ url_for('logout') }}">Logout</a></span>{% endif %}</div></nav>
  <main class="container">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</body>
</html>
